<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Mono:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<meta name="color-scheme" content="dark" />
		<title>reflectdb · whiteboard + pictionary</title>
		<meta
			name="description"
			content="A collaborative whiteboard synced with reflectdb, with a Pictionary mode on the same canvas. Draw together, watch peer cursors move, and guess in chat."
		/>
		<link rel="canonical" href="https://reflectdb-whiteboard.fly.dev/" />

		<!-- Social card. The image is served from reflectdb.dev rather than this
		     Machine: the demo auto-stops when idle, and a scraper that hits a cold
		     start would give up on the image before it woke. Source and regeneration
		     live in landing/og. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="reflectdb" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://reflectdb-whiteboard.fly.dev/" />
		<meta property="og:title" content="Collaborative whiteboard — built with reflectdb" />
		<meta
			property="og:description"
			content="A shared canvas with live peer cursors and chat. Every stroke is its own row, so nobody's line overwrites anyone else's."
		/>
		<meta property="og:image" content="https://reflectdb.dev/og-whiteboard.png" />
		<meta property="og:image:secure_url" content="https://reflectdb.dev/og-whiteboard.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="2400" />
		<meta property="og:image:height" content="1260" />
		<meta
			property="og:image:alt"
			content="Collaborative whiteboard, built with reflectdb — a shared sketch with two named peer cursors on it, beside the demo's URL."
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Collaborative whiteboard — built with reflectdb" />
		<meta
			name="twitter:description"
			content="Draw together in real time, or take turns in Pictionary mode. Open it in two tabs to draw with yourself."
		/>
		<meta name="twitter:image" content="https://reflectdb.dev/og-whiteboard.png" />
		<meta
			name="twitter:image:alt"
			content="A shared whiteboard sketch with two live peer cursors on it, beside the reflectdb wordmark."
		/>

		<meta name="theme-color" content="var(--on-accent-solid)" />
		<script>
			// Applies a pinned theme BEFORE first paint. Running this in the body,
			// or from the bundle, would show one frame of the wrong colours on
			// every load — the flash is the whole reason it is inline and here.
			try {
				var t = localStorage.getItem("reflectdb-theme");
				if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
			} catch (e) {
				/* private mode; the OS preference still applies */
			}
		</script>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			:root {
				--bg: var(--on-accent-solid);
				--bg-1: #111;
				--bg-2: #1a1a1a;
				--border: #222;
				--border-strong: #333;
				--text: #ededed;
				--muted: var(--muted);
				--accent: #818cf8;
				--accent-2: #3b82f6;
				--success: #4ade80;
				--warn: #facc15;
				--danger: #f87171;
				--dim: #555;
				--tint-danger: #3a1a1a;
				--tint-success: #1a3a1a;
				--tint-success-strong: #052e16;
				--tint-warn: #3a3a1a;
				--tint-warn-strong: #422006;
				--tint-accent: #1e1b4b;
				--tint-accent-strong: #1f1147;
				--accent-solid: #312e81;
				--accent-strong: #6366f1;
				--accent-line: #a5b4fc;
				--accent-line-soft: #4338ca40;
				--on-accent-soft: #c7d2fe;
				--on-accent: #fff;
				--on-accent-solid: #0a0a0a;
				--panel-grad-1: #1a1a2e;
				--panel-grad-2: #111;
				--warn-line: #facc1533;
				--warn-line-strong: #facc1555;
				--warn-tint: #facc150f;
				--scrim: rgba(0, 0, 0, 0.6);
				--overlay-line: rgba(255, 255, 255, 0.3);
				--toggle-bg: #111;
				--toggle-line: #222;
				--toggle-fg: var(--muted);
				--toggle-hover: #ededed;
			}

			/*
			 * Light palette, derived from the dark one so the two read as one
			 * design. Every chrome colour goes through a token; the ink colours a
			 * person draws with are deliberately NOT themed, because strokes are
			 * user data and re-mapping them would change what someone drew.
			 */
			@media (prefers-color-scheme: light) {
				:root:not([data-theme="dark"]) {
				--bg: #ffffff;
				--bg-1: #f7f7f8;
				--bg-2: #eeeef1;
				--border: #e2e2e6;
				--border-strong: #cfcfd6;
				--text: #17171a;
				--muted: #63636e;
				--accent: #4f46e5;
				--accent-2: #2563eb;
				--success: #15803d;
				--warn: #a16207;
				--danger: #dc2626;
				--dim: #8a8a94;
				/* Status tints invert: a dark wash reads as "filled in" on dark and
				   as a smudge on light, so light uses pale washes of the same hue. */
				--tint-danger: #fee2e2;
				--tint-success: #dcfce7;
				--tint-success-strong: #bbf7d0;
				--tint-warn: #fef9c3;
				--tint-warn-strong: #fde68a;
				--tint-accent: #e0e7ff;
				--tint-accent-strong: #c7d2fe;
				--accent-solid: #4f46e5;
				--accent-strong: #4f46e5;
				--accent-line: #6366f1;
				--accent-line-soft: #4f46e540;
				--on-accent-soft: #312e81;
				--on-accent: #ffffff;
				--on-accent-solid: #ffffff;
				--panel-grad-1: #ffffff;
				--panel-grad-2: #f4f4f6;
				--warn-line: #a1620733;
				--warn-line-strong: #a1620755;
				--warn-tint: #a162070f;
				--scrim: rgba(15, 15, 20, 0.45);
				--overlay-line: rgba(20, 20, 25, 0.3);
				--toggle-bg: #ffffff;
				--toggle-line: #e2e2e6;
				--toggle-fg: #63636e;
				--toggle-hover: #17171a;
				}
			}

			:root[data-theme="light"] {
				--bg: #ffffff;
				--bg-1: #f7f7f8;
				--bg-2: #eeeef1;
				--border: #e2e2e6;
				--border-strong: #cfcfd6;
				--text: #17171a;
				--muted: #63636e;
				--accent: #4f46e5;
				--accent-2: #2563eb;
				--success: #15803d;
				--warn: #a16207;
				--danger: #dc2626;
				--dim: #8a8a94;
				/* Status tints invert: a dark wash reads as "filled in" on dark and
				   as a smudge on light, so light uses pale washes of the same hue. */
				--tint-danger: #fee2e2;
				--tint-success: #dcfce7;
				--tint-success-strong: #bbf7d0;
				--tint-warn: #fef9c3;
				--tint-warn-strong: #fde68a;
				--tint-accent: #e0e7ff;
				--tint-accent-strong: #c7d2fe;
				--accent-solid: #4f46e5;
				--accent-strong: #4f46e5;
				--accent-line: #6366f1;
				--accent-line-soft: #4f46e540;
				--on-accent-soft: #312e81;
				--on-accent: #ffffff;
				--on-accent-solid: #ffffff;
				--panel-grad-1: #ffffff;
				--panel-grad-2: #f4f4f6;
				--warn-line: #a1620733;
				--warn-line-strong: #a1620755;
				--warn-tint: #a162070f;
				--scrim: rgba(15, 15, 20, 0.45);
				--overlay-line: rgba(20, 20, 25, 0.3);
				--toggle-bg: #ffffff;
				--toggle-line: #e2e2e6;
				--toggle-fg: #63636e;
				--toggle-hover: #17171a;
			}

			/* The toggle is fixed to the viewport, and this app has its own bar in
			   that corner — without the reservation it lands on top of the sign-out
			   button. */
			.header-right {
				padding-right: 38px;
			}

			#theme-toggle {
				position: fixed;
				top: 12px;
				right: 12px;
				z-index: 999;
				width: 30px;
				height: 30px;
				display: grid;
				place-items: center;
				border-radius: 999px;
				border: 1px solid var(--toggle-line);
				background: var(--toggle-bg);
				color: var(--toggle-fg);
				cursor: pointer;
				padding: 0;
			}

			#theme-toggle:hover {
				color: var(--toggle-hover);
				border-color: var(--toggle-hover);
			}

			#theme-toggle:focus-visible {
				outline: 2px solid var(--toggle-hover);
				outline-offset: 2px;
			}
			body {
				font-family: "Inter", sans-serif;
				background: var(--bg);
				color: var(--text);
				height: 100vh;
				display: flex;
				flex-direction: column;
				overflow: hidden;
				user-select: none;
			}
			button {
				font-family: inherit;
			}
			input,
			select {
				font-family: inherit;
			}

			#root {
				display: flex;
				flex-direction: column;
				flex: 1;
				min-height: 0;
			}

			.loading,
			.empty {
				display: flex;
				align-items: center;
				justify-content: center;
				flex: 1;
				color: var(--dim);
				font-size: 0.875rem;
				gap: 0.75rem;
			}

			.link-btn {
				background: none;
				border: 1px solid var(--border-strong);
				color: var(--muted);
				padding: 0.25rem 0.625rem;
				border-radius: 0.375rem;
				font-size: 0.75rem;
				cursor: pointer;
			}
			.link-btn:hover {
				border-color: var(--dim);
				color: var(--text);
			}

			/* ── Auth ────────────────────────────────────────────────── */
			.auth-container {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				height: 100vh;
				gap: 1rem;
			}
			.auth-container h1 {
				font-size: 1.25rem;
				font-weight: 600;
			}
			.subtitle {
				color: var(--muted);
				font-size: 0.875rem;
			}
			.error {
				color: var(--danger);
				font-size: 0.8125rem;
				padding: 0.5rem 0.75rem;
				background: var(--tint-danger);
				border-radius: 0.375rem;
			}
			.guest-btn {
				width: 320px;
				padding: 0.625rem;
				border-radius: 0.5rem;
				border: none;
				background: var(--text);
				color: var(--bg);
				font-size: 0.875rem;
				font-weight: 500;
				cursor: pointer;
			}
			.guest-btn:hover {
				opacity: 0.85;
			}
			.guest-btn:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			/* ── Top bar ─────────────────────────────────────────────── */
			.topbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0.5rem 1rem;
				border-bottom: 1px solid var(--bg-2);
				flex-shrink: 0;
			}
			.brand {
				font-weight: 700;
				font-size: 0.875rem;
				letter-spacing: 0.02em;
			}
			.header-left,
			.header-right {
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}
			.user-name {
				color: var(--muted);
				font-size: 0.8125rem;
			}
			.sign-out {
				background: none;
				border: 1px solid var(--border-strong);
				color: var(--muted);
				padding: 0.25rem 0.625rem;
				border-radius: 0.375rem;
				font-size: 0.75rem;
				cursor: pointer;
			}
			.sign-out:hover {
				border-color: var(--dim);
				color: var(--text);
			}

			.status {
				padding: 0.25rem 0.5rem;
				border-radius: 0.25rem;
				font-size: 0.6875rem;
				font-weight: 500;
			}
			.status.connected,
			.status.synced {
				background: var(--tint-success);
				color: var(--success);
			}
			.status.disconnected {
				background: var(--tint-danger);
				color: var(--danger);
			}
			.status.connecting,
			.status.bootstrapping,
			.status.hydrating {
				background: var(--tint-warn);
				color: var(--warn);
			}

			/* ── Lobby ───────────────────────────────────────────────── */
			.lobby {
				flex: 1;
				display: flex;
				flex-direction: column;
				padding: 2rem;
				gap: 1.5rem;
				overflow-y: auto;
			}
			.lobby-header {
				display: flex;
				justify-content: space-between;
				align-items: flex-end;
				gap: 1rem;
				flex-wrap: wrap;
			}
			.lobby-header h1 {
				font-size: 1.25rem;
				font-weight: 600;
			}
			.create-form {
				display: flex;
				gap: 0.5rem;
				flex-wrap: wrap;
			}
			.create-form input,
			.create-form select {
				padding: 0.5rem 0.625rem;
				border-radius: 0.375rem;
				border: 1px solid var(--border-strong);
				background: var(--bg-1);
				color: var(--text);
				font-size: 0.8125rem;
				outline: none;
			}
			.create-form input:focus,
			.create-form select:focus {
				border-color: var(--accent);
			}
			.create-form button {
				padding: 0.5rem 1rem;
				border-radius: 0.375rem;
				border: none;
				background: var(--accent);
				color: var(--on-accent-solid);
				font-size: 0.8125rem;
				font-weight: 600;
				cursor: pointer;
			}
			.create-form button:hover {
				background: var(--accent-strong);
				color: var(--on-accent);
			}
			.empty-rooms {
				color: var(--dim);
				text-align: center;
				padding: 3rem;
				font-size: 0.875rem;
				border: 1px dashed var(--border-strong);
				border-radius: 0.5rem;
			}
			.room-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
				gap: 0.75rem;
			}
			.room-card {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				padding: 0.875rem;
				border-radius: 0.5rem;
				border: 1px solid var(--border-strong);
				background: var(--bg-1);
				cursor: pointer;
				text-align: left;
				color: var(--text);
				min-height: 110px;
			}
			.room-card:hover {
				border-color: var(--accent);
			}
			.room-card.pictionary {
				border-color: var(--accent-line-soft);
				background: linear-gradient(135deg, var(--panel-grad-1), var(--panel-grad-2));
			}
			.room-card.pictionary:hover {
				border-color: var(--accent);
			}
			.room-card-top {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 0.5rem;
			}
			.room-mode {
				font-size: 0.625rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				padding: 0.125rem 0.375rem;
				border-radius: 0.25rem;
				background: var(--bg-2);
				color: var(--muted);
			}
			.room-mode.pictionary {
				background: var(--accent-solid);
				color: var(--on-accent-soft);
			}
			.room-state {
				font-size: 0.625rem;
				color: var(--dim);
				text-transform: uppercase;
				letter-spacing: 0.08em;
			}
			.room-state.state-drawing {
				color: var(--success);
			}
			.room-state.state-picking {
				color: var(--accent);
			}
			.room-state.state-finished {
				color: var(--muted);
			}
			.room-state.state-round_end {
				color: var(--warn);
			}
			.room-name {
				font-size: 0.9375rem;
				font-weight: 600;
			}
			.room-meta {
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-size: 0.75rem;
				color: var(--muted);
				margin-top: auto;
			}
			.room-expiry {
				font-size: 0.6875rem;
				color: var(--dim);
				font-variant-numeric: tabular-nums;
			}
			.expiry-notice {
				margin-bottom: 0.75rem;
				padding: 0.625rem 0.75rem;
				border-radius: 0.5rem;
				border: 1px solid var(--warn-line);
				background: var(--warn-tint);
				color: var(--warn);
				font-size: 0.8125rem;
			}
			.room-expiry-badge {
				font-size: 0.6875rem;
				color: var(--muted);
				padding: 0.125rem 0.5rem;
				border-radius: 0.25rem;
				border: 1px solid var(--border-strong);
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}
			.room-expiry-badge.urgent {
				color: var(--warn);
				border-color: var(--warn-line-strong);
			}
			.room-delete {
				background: none;
				border: 1px solid var(--border-strong);
				color: var(--dim);
				padding: 0.125rem 0.5rem;
				border-radius: 0.25rem;
				font-size: 0.6875rem;
				cursor: pointer;
			}
			.room-delete:hover {
				border-color: var(--danger);
				color: var(--danger);
			}

			/* ── Game room ───────────────────────────────────────────── */
			.game-room {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: 0;
			}
			.room-header {
				display: flex;
				align-items: center;
				gap: 1rem;
				padding: 0.625rem 1rem;
				border-bottom: 1px solid var(--bg-2);
				flex-shrink: 0;
			}
			.back-btn {
				background: none;
				border: 1px solid var(--border-strong);
				color: var(--muted);
				padding: 0.25rem 0.625rem;
				border-radius: 0.375rem;
				font-size: 0.75rem;
				cursor: pointer;
			}
			.back-btn:hover {
				border-color: var(--dim);
				color: var(--text);
			}
			.room-title {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				flex: 1;
			}
			.room-title h1 {
				font-size: 0.9375rem;
				font-weight: 600;
			}
			.room-actions {
				display: flex;
				gap: 0.5rem;
			}
			.reset-btn {
				background: none;
				border: 1px solid var(--border-strong);
				color: var(--muted);
				padding: 0.25rem 0.625rem;
				border-radius: 0.375rem;
				font-size: 0.75rem;
				cursor: pointer;
			}
			.reset-btn:hover {
				border-color: var(--danger);
				color: var(--danger);
			}

			/* ── HUD ─────────────────────────────────────────────────── */
			.hud {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				align-items: center;
				gap: 1rem;
				padding: 0.625rem 1rem;
				border-bottom: 1px solid var(--bg-2);
				background: linear-gradient(180deg, var(--panel-grad-1), var(--panel-grad-2));
				flex-shrink: 0;
			}
			.hud-left,
			.hud-right {
				display: flex;
				align-items: center;
				gap: 0.625rem;
			}
			.hud-right {
				justify-content: flex-end;
			}
			.hud-state {
				font-size: 0.6875rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.1em;
				padding: 0.25rem 0.5rem;
				border-radius: 0.25rem;
				background: var(--bg-2);
				color: var(--muted);
			}
			.hud-state.state-drawing {
				background: var(--tint-success-strong);
				color: var(--success);
			}
			.hud-state.state-picking {
				background: var(--tint-accent-strong);
				color: var(--on-accent-soft);
			}
			.hud-state.state-round_end {
				background: var(--tint-warn-strong);
				color: var(--warn);
			}
			.hud-state.state-finished {
				background: var(--tint-danger);
				color: var(--warn);
			}
			.winner-banner {
				font-weight: 600;
			}
			.winner-banner strong {
				color: var(--warn);
			}
			/* Pick options (drawer only, picking phase) */
			.pick-row {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 4px;
			}
			.pick-options {
				display: flex;
				gap: 0.5rem;
			}
			.pick-btn {
				padding: 0.5rem 1rem;
				border-radius: 0.5rem;
				border: 1px solid var(--accent);
				background: linear-gradient(180deg, var(--tint-accent), var(--tint-accent-strong));
				color: var(--on-accent-soft);
				font-size: 0.875rem;
				font-weight: 600;
				cursor: pointer;
				font-family: "Space Mono", monospace;
				letter-spacing: 0.05em;
			}
			.pick-btn:hover {
				background: linear-gradient(180deg, var(--accent-solid), var(--tint-accent-strong));
				border-color: var(--accent-line);
				transform: translateY(-1px);
			}
			.pick-btn:active {
				transform: translateY(0);
			}
			.hud-drawer {
				font-size: 0.8125rem;
				color: var(--muted);
			}
			.hud-drawer strong {
				color: var(--text);
			}
			.hud-center {
				display: flex;
				justify-content: center;
			}
			.word-display {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 2px;
			}
			.word-label {
				font-size: 0.625rem;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.1em;
			}
			.word {
				font-family: "Space Mono", monospace;
				font-size: 1.25rem;
				font-weight: 700;
				letter-spacing: 0.15em;
				color: var(--text);
			}
			.word.mask {
				letter-spacing: 0.2em;
				color: var(--on-accent-soft);
			}
			.word-len {
				font-size: 0.625rem;
				color: var(--dim);
			}
			.hud-timer {
				font-family: "Space Mono", monospace;
				font-size: 1.25rem;
				font-weight: 700;
				color: var(--text);
				min-width: 3rem;
				text-align: right;
			}
			.hud-timer.low {
				color: var(--danger);
				animation: pulse 1s ease-in-out infinite;
			}
			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.5;
				}
			}
			.hud-btn {
				padding: 0.375rem 0.875rem;
				border-radius: 0.375rem;
				border: 1px solid var(--border-strong);
				background: var(--bg-1);
				color: var(--text);
				font-size: 0.8125rem;
				cursor: pointer;
			}
			.hud-btn:hover:not(:disabled) {
				border-color: var(--dim);
			}
			.hud-btn:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}
			.hud-btn.primary {
				background: var(--accent);
				border-color: var(--accent);
				color: var(--on-accent-solid);
				font-weight: 600;
			}
			.hud-btn.primary:hover:not(:disabled) {
				background: var(--accent-strong);
				border-color: var(--accent-strong);
				color: var(--on-accent);
			}

			/* ── Game body ───────────────────────────────────────────── */
			.game-body {
				flex: 1;
				display: flex;
				min-height: 0;
			}
			.game-main {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-width: 0;
			}
			.game-side {
				width: 320px;
				display: flex;
				flex-direction: column;
				border-left: 1px solid var(--bg-2);
				flex-shrink: 0;
			}

			/* ── Canvas ──────────────────────────────────────────────── */
			.canvas-wrap {
				flex: 1;
				position: relative;
				background: var(--bg-1);
				cursor: crosshair;
				overflow: hidden;
			}
			.canvas-wrap.view-only {
				cursor: default;
			}
			.canvas-wrap.panning {
				cursor: grab;
			}
			.canvas-wrap.panning:active {
				cursor: grabbing;
			}
			.canvas-wrap canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}
			.canvas-overlay-note {
				position: absolute;
				top: 0.75rem;
				left: 50%;
				transform: translateX(-50%);
				background: var(--scrim);
				border: 1px solid var(--border-strong);
				color: var(--muted);
				padding: 0.375rem 0.75rem;
				border-radius: 0.5rem;
				font-size: 0.75rem;
				pointer-events: none;
				backdrop-filter: blur(8px);
			}
			.presence-cursor {
				position: absolute;
				pointer-events: none;
				z-index: 10;
				transition:
					left 0.1s linear,
					top 0.1s linear;
			}
			.presence-label {
				position: absolute;
				left: 16px;
				top: 14px;
				font-size: 0.625rem;
				color: var(--on-accent-solid);
				font-weight: 600;
				white-space: nowrap;
				padding: 2px 6px;
				border-radius: 4px;
			}

			/* ── Toolbar ─────────────────────────────────────────────── */
			.toolbar {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 1.5rem;
				padding: 0.625rem 1rem;
				border-top: 1px solid var(--bg-2);
				flex-shrink: 0;
			}
			.toolbar.disabled {
				opacity: 0.4;
				pointer-events: none;
			}
			.tool-group {
				display: flex;
				align-items: center;
				gap: 4px;
			}
			.color-btn {
				width: 24px;
				height: 24px;
				border-radius: 50%;
				border: 2px solid transparent;
				cursor: pointer;
				transition: border-color 0.1s;
			}
			.color-btn:hover {
				border-color: var(--overlay-line);
			}
			.color-btn.active {
				border-color: var(--text);
			}
			.size-btn {
				width: 32px;
				height: 32px;
				border-radius: 0.375rem;
				border: 1px solid transparent;
				background: none;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.size-btn:hover {
				border-color: var(--border-strong);
			}
			.size-btn.active {
				border-color: var(--muted);
				background: var(--bg-2);
			}
			.size-dot {
				display: block;
				border-radius: 50%;
				background: var(--muted);
			}

			/* ── Sidebar ─────────────────────────────────────────────── */
			.sidebar {
				border-bottom: 1px solid var(--bg-2);
			}
			.sidebar-section {
				padding: 0.75rem;
			}
			.sidebar-section h3 {
				font-size: 0.6875rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.1em;
				color: var(--muted);
				margin-bottom: 0.5rem;
			}
			.player-list {
				list-style: none;
				display: flex;
				flex-direction: column;
				gap: 0.25rem;
			}
			.player {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 0.375rem 0.5rem;
				border-radius: 0.375rem;
				background: var(--bg-1);
				border: 1px solid transparent;
				font-size: 0.8125rem;
			}
			.player.self {
				border-color: var(--accent);
			}
			.player.drawer {
				background: var(--tint-accent);
			}
			.player.guessed {
				background: var(--tint-success-strong);
			}
			.player-name {
				display: flex;
				align-items: center;
				gap: 0.375rem;
				color: var(--text);
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.badge {
				font-size: 0.625rem;
				padding: 1px 5px;
				border-radius: 4px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.05em;
			}
			.drawer-badge {
				background: var(--accent);
				color: var(--on-accent-solid);
			}
			.guess-badge {
				background: var(--success);
				color: var(--tint-success-strong);
			}
			.self-badge {
				background: var(--bg-2);
				color: var(--muted);
			}
			.player-score {
				font-family: "Space Mono", monospace;
				font-weight: 700;
				color: var(--text);
			}

			/* ── Chat ────────────────────────────────────────────────── */
			.chat {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-height: 0;
			}
			.chat-header {
				font-size: 0.6875rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.1em;
				color: var(--muted);
				padding: 0.75rem 0.75rem 0.5rem;
			}
			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 0 0.5rem 0.5rem;
				display: flex;
				flex-direction: column;
				gap: 0.25rem;
			}
			.chat-empty {
				color: var(--dim);
				text-align: center;
				padding: 2rem;
				font-size: 0.8125rem;
			}
			.chat-msg {
				display: flex;
				flex-direction: column;
				gap: 1px;
				padding: 0.375rem 0.5rem;
				background: var(--bg-2);
				border-radius: 0.375rem;
			}
			.chat-msg.mine {
				background: var(--tint-success);
			}
			.chat-msg.kind-system {
				background: transparent;
				color: var(--muted);
				font-style: italic;
				text-align: center;
				padding: 0.25rem 0.5rem;
			}
			.chat-msg.kind-system .chat-author {
				display: none;
			}
			.chat-msg.kind-correct {
				background: var(--tint-success-strong);
				border-left: 2px solid var(--success);
			}
			.chat-msg.kind-close {
				background: var(--tint-warn-strong);
				border-left: 2px solid var(--warn);
			}
			.chat-author {
				font-size: 0.625rem;
				color: var(--muted);
				font-weight: 500;
			}
			.chat-text {
				font-size: 0.8125rem;
				color: var(--text);
				word-break: break-word;
			}
			.chat-input {
				display: flex;
				gap: 0.375rem;
				padding: 0.5rem;
				border-top: 1px solid var(--border);
			}
			.chat-input input {
				flex: 1;
				padding: 0.375rem 0.5rem;
				border-radius: 0.375rem;
				border: 1px solid var(--border-strong);
				background: var(--bg);
				color: var(--text);
				font-size: 0.8125rem;
				outline: none;
			}
			.chat-input input:focus {
				border-color: var(--dim);
			}
			.chat-input input:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
			.chat-input button {
				padding: 0.375rem 0.75rem;
				border-radius: 0.375rem;
				border: none;
				background: var(--accent-2);
				color: var(--on-accent);
				font-size: 0.75rem;
				cursor: pointer;
				font-weight: 600;
			}
			.chat-input button:disabled {
				opacity: 0.3;
				cursor: not-allowed;
			}

			@media (max-width: 720px) {
				.game-body {
					flex-direction: column;
				}
				.game-side {
					width: auto;
					height: 280px;
					border-left: none;
					border-top: 1px solid var(--bg-2);
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./render.tsx"></script>
		<button id="theme-toggle" type="button" aria-label="Switch theme"></button>
		<script>
			// Three states: nothing pinned follows the OS, an explicit pick writes
			// data-theme plus localStorage. The icon shows where a click GOES —
			// a sun while dark — not where you currently are.
			(function () {
				var SUN =
					'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.2v1.6M8 13.2v1.6M14.8 8h-1.6M2.8 8H1.2M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1M12.8 12.8l-1.1-1.1M4.3 4.3 3.2 3.2"/></g></svg>';
				var MOON =
					'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M13.7 10.1A5.9 5.9 0 0 1 6.2 2.5a6.5 6.5 0 1 0 7.5 7.6Z"/></svg>';
				var button = document.getElementById("theme-toggle");
				if (!button) return;
				var root = document.documentElement;
				var media = window.matchMedia("(prefers-color-scheme: dark)");

				function resolve() {
					var pinned = root.dataset.theme;
					if (pinned === "light" || pinned === "dark") return pinned;
					return media.matches ? "dark" : "light";
				}
				function paint(theme) {
					var next = theme === "dark" ? "light" : "dark";
					button.innerHTML = theme === "dark" ? SUN : MOON;
					button.setAttribute("aria-label", "Switch to " + next + " theme");
					button.setAttribute("title", "Switch to " + next + " theme");
				}
				paint(resolve());
				button.addEventListener("click", function () {
					var next = resolve() === "dark" ? "light" : "dark";
					root.dataset.theme = next;
					try {
						localStorage.setItem("reflectdb-theme", next);
					} catch (e) {
						/* pick still holds for this page */
					}
					paint(next);
				});
				// Until something is pinned the OS is in charge, so follow it.
				media.addEventListener("change", function () {
					if (!root.dataset.theme) paint(resolve());
				});
			})();
		</script>
	</body>
</html>
