<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<title>reflectdb · infinite tetris</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			:root {
				--bg: #08090d;
				--panel: #101118;
				--well: #090a0f;
				--line: #242631;
				--fg: #f1f2f6;
				--muted: #8a8e9d;
				--accent: #b8ff63;
				--danger: #ff647c;
				--mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
			}
			html,
			body,
			#root {
				min-height: 100%;
			}
			body {
				background: var(--bg);
				color: var(--fg);
				font-family: var(--mono);
				font-size: 13px;
				user-select: none;
			}
			button {
				font: inherit;
				color: inherit;
			}
			.shell {
				min-height: 100vh;
				display: grid;
				grid-template-columns: minmax(500px, 1fr) 390px;
			}
			.game-area {
				min-width: 0;
				padding: clamp(20px, 4vw, 54px);
				display: flex;
				flex-direction: column;
				align-items: center;
				background:
					radial-gradient(circle at 48% 42%, #191c28 0, #0c0d13 36%, transparent 68%),
					linear-gradient(135deg, #0b0c11, #08090d);
			}
			.game-heading {
				width: min(100%, 620px);
				display: flex;
				align-items: start;
				justify-content: space-between;
				margin-bottom: 22px;
			}
			.eyebrow {
				color: var(--accent);
				font-size: 10px;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				margin-bottom: 5px;
			}
			h1 {
				font-size: clamp(24px, 3vw, 38px);
				line-height: 1;
				letter-spacing: -0.055em;
			}
			.status {
				border: 1px solid var(--line);
				border-radius: 999px;
				color: var(--muted);
				padding: 5px 9px;
				font-size: 9px;
				text-transform: uppercase;
				letter-spacing: 0.1em;
			}
			.status.synced {
				color: var(--accent);
				border-color: #445e2d;
			}
			.status.disconnected {
				color: var(--danger);
				border-color: #61303a;
			}
			.play-layout {
				display: flex;
				justify-content: center;
				align-items: flex-start;
				gap: clamp(18px, 3vw, 34px);
			}
			.well-wrap {
				position: relative;
			}
			.tetris-board {
				width: min(44vw, 350px);
				aspect-ratio: 1 / 2;
				display: grid;
				grid-template-columns: repeat(10, 1fr);
				grid-template-rows: repeat(20, 1fr);
				gap: 1px;
				padding: 5px;
				background: #20222d;
				border: 1px solid #363946;
				box-shadow:
					0 26px 70px #0009,
					inset 0 0 30px #0008;
			}
			.cell {
				min-width: 0;
				min-height: 0;
				background: var(--well);
				border-radius: 1px;
			}
			.cell[class*="piece-"]:not(.piece-0) {
				border: 1px solid #ffffff28;
				box-shadow: inset 0 0 0 2px #ffffff0d;
			}
			.piece-1 {
				background: #36d9ff;
			}
			.piece-2 {
				background: #ffe052;
			}
			.piece-3 {
				background: #ba76ff;
			}
			.piece-4 {
				background: #73eb69;
			}
			.piece-5 {
				background: #ff5e73;
			}
			.piece-6 {
				background: #5c8cff;
			}
			.piece-7 {
				background: #ff9b4a;
			}
			.cell.active {
				filter: brightness(1.18);
				box-shadow:
					inset 0 0 0 2px #ffffff35,
					0 0 8px #ffffff25;
			}
			.cell.ghost {
				background: transparent;
				border: 1px solid #ffffff3d !important;
				box-shadow: none !important;
			}
			.overlay {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				color: var(--muted);
				font-size: 10px;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			.run-stats {
				width: 170px;
				display: flex;
				flex-direction: column;
				gap: 9px;
			}
			.identity,
			.stat,
			.next-card {
				background: #0b0c12cc;
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 10px 12px;
			}
			.identity {
				border-left-width: 3px;
			}
			.identity span,
			.stat span,
			.next-card > span {
				display: block;
				color: var(--muted);
				font-size: 9px;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				margin-bottom: 4px;
			}
			.identity strong {
				font-size: 12px;
				overflow-wrap: anywhere;
			}
			.stat {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
			}
			.stat span {
				margin: 0;
			}
			.stat strong {
				font-size: 20px;
			}
			.stat.danger strong {
				color: var(--danger);
			}
			.next-card {
				min-height: 103px;
			}
			.piece-preview {
				width: 72px;
				height: 72px;
				margin: 5px auto 0;
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				grid-template-rows: repeat(4, 1fr);
				gap: 2px;
			}
			.piece-preview .cell {
				background: transparent;
			}
			.piece-preview .cell[class*="piece-"] {
				border-radius: 2px;
			}
			.death-note {
				color: #626676;
				font-size: 10px;
				line-height: 1.5;
				padding: 2px;
			}
			.controls {
				width: min(100%, 620px);
				display: grid;
				grid-template-columns: repeat(5, 1fr) 1.5fr;
				gap: 6px;
				margin-top: 18px;
			}
			.controls button,
			footer button {
				border: 1px solid #30333f;
				background: #11131a;
				border-radius: 5px;
				padding: 10px 8px;
				cursor: pointer;
				touch-action: manipulation;
			}
			.controls button:hover:not(:disabled),
			footer button:hover {
				border-color: var(--accent);
				background: #171a20;
			}
			.controls button:active:not(:disabled) {
				transform: translateY(1px);
			}
			.controls button:disabled {
				opacity: 0.35;
				cursor: default;
			}
			.controls p {
				grid-column: 1 / -1;
				color: #5e6270;
				text-align: center;
				font-size: 9px;
				margin-top: 3px;
			}
			.community {
				min-width: 0;
				border-left: 1px solid var(--line);
				background: var(--panel);
				padding: 20px;
				display: flex;
				flex-direction: column;
				gap: 15px;
			}
			.crowd-heading {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.crowd-heading h2,
			.standings-title {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.12em;
			}
			.crowd-heading p {
				color: var(--muted);
				font-size: 10px;
				margin-top: 3px;
			}
			.live-dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 10px var(--accent);
			}
			.mini-grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 8px;
				min-height: 110px;
			}
			.mini-player {
				min-width: 0;
			}
			.mini-label {
				display: flex;
				gap: 4px;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 3px;
				font-size: 7px;
			}
			.mini-label span {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.mini-label b {
				color: var(--muted);
				font-weight: 400;
			}
			.tetris-board.mini {
				width: 100%;
				padding: 2px;
				gap: 0;
				border-color: #292b35;
				box-shadow: none;
			}
			.tetris-board.mini .cell {
				border-radius: 0;
				border-width: 0;
				box-shadow: none;
			}
			.nobody {
				grid-column: 1 / -1;
				align-self: center;
				color: #5f6370;
				font-size: 10px;
				line-height: 1.5;
				text-align: center;
			}
			.more {
				color: var(--muted);
				text-align: right;
				font-size: 9px;
				margin-top: -8px;
			}
			.standings-title {
				margin-top: 5px;
			}
			.standings {
				list-style: none;
				display: flex;
				flex-direction: column;
				gap: 3px;
			}
			.standings li {
				display: flex;
				align-items: center;
				gap: 7px;
				min-width: 0;
				border: 1px solid transparent;
				border-radius: 4px;
				background: #0b0c11;
				padding: 6px 7px;
				font-size: 10px;
			}
			.standings li.self {
				border-color: #455b2e;
			}
			.standings .rank {
				width: 14px;
				color: #5f6270;
				text-align: right;
			}
			.standings i {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				flex: 0 0 auto;
			}
			.standings .who {
				flex: 1;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.standings .lines {
				color: var(--muted);
			}
			.standings strong {
				min-width: 38px;
				text-align: right;
			}
			.community footer {
				margin-top: auto;
				border-top: 1px solid var(--line);
				padding-top: 14px;
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.community footer button {
				font-size: 10px;
				padding: 8px;
			}
			.community footer p {
				color: #5f6370;
				font-size: 9px;
				line-height: 1.5;
			}
			@media (max-width: 900px) {
				.shell {
					grid-template-columns: 1fr;
				}
				.community {
					border-left: 0;
					border-top: 1px solid var(--line);
				}
				.mini-grid {
					grid-template-columns: repeat(8, 1fr);
				}
			}
			@media (max-width: 560px) {
				.game-area {
					padding: 18px 12px;
				}
				.play-layout {
					width: 100%;
					gap: 10px;
				}
				.tetris-board {
					width: min(62vw, 310px);
				}
				.run-stats {
					width: 29vw;
					min-width: 105px;
				}
				.identity,
				.stat,
				.next-card {
					padding: 7px;
				}
				.identity strong {
					font-size: 9px;
				}
				.stat strong {
					font-size: 15px;
				}
				.next-card {
					min-height: 76px;
				}
				.piece-preview {
					width: 52px;
					height: 52px;
				}
				.death-note {
					display: none;
				}
				.controls {
					grid-template-columns: repeat(3, 1fr);
				}
				.mini-grid {
					grid-template-columns: repeat(4, 1fr);
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./render.tsx"></script>
	</body>
</html>
