<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<title>reflectdb · infinite tetris</title>
		<meta
			name="description"
			content="One perpetual multiplayer Tetris game, synced with reflectdb. Inputs render optimistically, reconcile against the server, and fan out to every player."
		/>
		<link rel="canonical" href="https://reflectdb-tetris.fly.dev/" />

		<!-- Social card. The image is served from reflectdb.dev rather than this
		     Machine: the demo auto-stops when idle, and a scraper that hits a cold
		     start would give up on the image before it woke. Source and regeneration
		     live in landing/og. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="reflectdb" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://reflectdb-tetris.fly.dev/" />
		<meta property="og:title" content="Infinite multiplayer Tetris — built with reflectdb" />
		<meta
			property="og:description"
			content="One perpetual game, one well per player. Inputs render instantly, reconcile against the server, and fan out to everyone watching."
		/>
		<meta property="og:image" content="https://reflectdb.dev/og-tetris.png" />
		<meta property="og:image:secure_url" content="https://reflectdb.dev/og-tetris.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="2400" />
		<meta property="og:image:height" content="1260" />
		<meta
			property="og:image:alt"
			content="Infinite multiplayer Tetris, built with reflectdb — a Tetris well with a completed row lit up, beside the demo's URL."
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Infinite multiplayer Tetris — built with reflectdb" />
		<meta
			name="twitter:description"
			content="One perpetual game, one well per player. Open it in two tabs to add another player."
		/>
		<meta name="twitter:image" content="https://reflectdb.dev/og-tetris.png" />
		<meta
			name="twitter:image:alt"
			content="A Tetris well with a completed row lit up, beside the reflectdb wordmark."
		/>

		<meta name="theme-color" content="#08090d" />
		<script>
			// Applies a pinned theme BEFORE first paint. Running this in the body,
			// or from the bundle, would show one frame of the wrong colours on
			// every load — the flash is the whole reason it is inline and here.
			try {
				var t = localStorage.getItem("reflectdb-theme");
				if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
			} catch (e) {
				/* private mode; the OS preference still applies */
			}
		</script>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			:root {
				--bg: #08090d;
				--panel: #101118;
				--well: #090a0f;
				--line: #242631;
				--fg: #f1f2f6;
				--muted: #8a8e9d;
				--accent: #b8ff63;
				--danger: #ff647c;
				--mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
				--field-1: #191c28;
				--field-2: #0c0d13;
				--field-3: #0b0c11;
				--raised: #20222d;
				--raised-line: #363946;
				--shadow-drop: #0009;
				--shadow-inset: #0008;
				--cell-line: #ffffff28;
				--cell-inset: #ffffff0d;
				--cell-active: #ffffff35;
				--cell-glow: #ffffff25;
				--cell-strong: #ffffff3d;
				--scrim: #0b0c12cc;
				--faint: #5f6370;
				--input-line: #30333f;
				--input-bg: #11131a;
				--row-bg: #171a20;
				--rule: #292b35;
				--ok-line: #445e2d;
				--danger-line: #61303a;
				--accent-line: #455b2e;
				--toggle-bg: #101118;
				--toggle-line: #242631;
				--toggle-fg: #8a8e9d;
				--toggle-hover: #f1f2f6;
			}

			/*
			 * Light palette. Dark stays the default — the well is the focus and a
			 * dark surround keeps it that way — so light is derived from it rather
			 * than invented, and every chrome colour goes through a token so the
			 * two themes cannot drift. The seven piece colours are deliberately
			 * NOT themed: they are game state, and re-mapping them would change
			 * what a player reads off the board.
			 */
			@media (prefers-color-scheme: light) {
				:root:not([data-theme="dark"]) {
				--bg: #f6f7f9;
				--panel: #ffffff;
				--well: #eef0f4;
				--line: #d8dbe3;
				--fg: #14151a;
				--muted: #5f6472;
				--accent: #3f7d12;
				--danger: #c22745;
				--field-1: #ffffff;
				--field-2: #eef1f6;
				--field-3: #e9ecf2;
				--raised: #ffffff;
				--raised-line: #d3d7e0;
				--shadow-drop: #1416201f;
				--shadow-inset: #14162010;
				/* Dark hairlines on a light ground: the dark theme's white overlays
				   are invisible here, so the cell grid inverts rather than fades. */
				--cell-line: #14162033;
				--cell-inset: #1416200a;
				--cell-active: #14162040;
				--cell-glow: #14162014;
				--cell-strong: #14162055;
				--scrim: #f6f7f9d9;
				--faint: #7b8090;
				--input-line: #d3d7e0;
				--input-bg: #ffffff;
				--row-bg: #f0f2f6;
				--rule: #e3e6ec;
				--ok-line: #a8cf86;
				--danger-line: #e8a3b0;
				--accent-line: #a8cf86;
				--toggle-bg: #ffffff;
				--toggle-line: #d8dbe3;
				--toggle-fg: #5f6472;
				--toggle-hover: #14151a;
				}
			}

			:root[data-theme="light"] {
				--bg: #f6f7f9;
				--panel: #ffffff;
				--well: #eef0f4;
				--line: #d8dbe3;
				--fg: #14151a;
				--muted: #5f6472;
				--accent: #3f7d12;
				--danger: #c22745;
				--field-1: #ffffff;
				--field-2: #eef1f6;
				--field-3: #e9ecf2;
				--raised: #ffffff;
				--raised-line: #d3d7e0;
				--shadow-drop: #1416201f;
				--shadow-inset: #14162010;
				/* Dark hairlines on a light ground: the dark theme's white overlays
				   are invisible here, so the cell grid inverts rather than fades. */
				--cell-line: #14162033;
				--cell-inset: #1416200a;
				--cell-active: #14162040;
				--cell-glow: #14162014;
				--cell-strong: #14162055;
				--scrim: #f6f7f9d9;
				--faint: #7b8090;
				--input-line: #d3d7e0;
				--input-bg: #ffffff;
				--row-bg: #f0f2f6;
				--rule: #e3e6ec;
				--ok-line: #a8cf86;
				--danger-line: #e8a3b0;
				--accent-line: #a8cf86;
				--toggle-bg: #ffffff;
				--toggle-line: #d8dbe3;
				--toggle-fg: #5f6472;
				--toggle-hover: #14151a;
			}

			#theme-toggle {
				position: fixed;
				top: 12px;
				right: 12px;
				z-index: 999;
				width: 30px;
				height: 30px;
				display: grid;
				place-items: center;
				border-radius: 999px;
				border: 1px solid var(--toggle-line);
				background: var(--toggle-bg);
				color: var(--toggle-fg);
				cursor: pointer;
				padding: 0;
			}

			#theme-toggle:hover {
				color: var(--toggle-hover);
				border-color: var(--toggle-hover);
			}

			#theme-toggle:focus-visible {
				outline: 2px solid var(--toggle-hover);
				outline-offset: 2px;
			}
			html,
			body,
			#root {
				min-height: 100%;
			}
			body {
				background: var(--bg);
				color: var(--fg);
				font-family: var(--mono);
				font-size: 13px;
				user-select: none;
			}
			button {
				font: inherit;
				color: inherit;
			}
			.shell {
				min-height: 100vh;
				display: grid;
				grid-template-columns: minmax(500px, 1fr) 390px;
			}
			.game-area {
				min-width: 0;
				padding: clamp(20px, 4vw, 54px);
				display: flex;
				flex-direction: column;
				align-items: center;
				background:
					radial-gradient(circle at 48% 42%, var(--field-1) 0, var(--field-2) 36%, transparent 68%),
					linear-gradient(135deg, var(--field-3), var(--bg));
			}
			.game-heading {
				width: min(100%, 620px);
				display: flex;
				align-items: start;
				justify-content: space-between;
				margin-bottom: 22px;
			}
			.eyebrow {
				color: var(--accent);
				font-size: 10px;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				margin-bottom: 5px;
			}
			h1 {
				font-size: clamp(24px, 3vw, 38px);
				line-height: 1;
				letter-spacing: -0.055em;
			}
			.status {
				border: 1px solid var(--line);
				border-radius: 999px;
				color: var(--muted);
				padding: 5px 9px;
				font-size: 9px;
				text-transform: uppercase;
				letter-spacing: 0.1em;
			}
			.status.synced {
				color: var(--accent);
				border-color: var(--ok-line);
			}
			.status.disconnected {
				color: var(--danger);
				border-color: var(--danger-line);
			}
			.play-layout {
				display: flex;
				justify-content: center;
				align-items: flex-start;
				gap: clamp(18px, 3vw, 34px);
			}
			.well-wrap {
				position: relative;
			}
			.tetris-board {
				width: min(44vw, 350px);
				aspect-ratio: 1 / 2;
				display: grid;
				grid-template-columns: repeat(10, 1fr);
				grid-template-rows: repeat(20, 1fr);
				gap: 1px;
				padding: 5px;
				background: var(--raised);
				border: 1px solid var(--raised-line);
				box-shadow:
					0 26px 70px var(--shadow-drop),
					inset 0 0 30px var(--shadow-inset);
			}
			.cell {
				min-width: 0;
				min-height: 0;
				background: var(--well);
				border-radius: 1px;
			}
			.cell[class*="piece-"]:not(.piece-0) {
				border: 1px solid var(--cell-line);
				box-shadow: inset 0 0 0 2px var(--cell-inset);
			}
			.piece-1 {
				background: #36d9ff;
			}
			.piece-2 {
				background: #ffe052;
			}
			.piece-3 {
				background: #ba76ff;
			}
			.piece-4 {
				background: #73eb69;
			}
			.piece-5 {
				background: #ff5e73;
			}
			.piece-6 {
				background: #5c8cff;
			}
			.piece-7 {
				background: #ff9b4a;
			}
			.cell.active {
				filter: brightness(1.18);
				box-shadow:
					inset 0 0 0 2px var(--cell-active),
					0 0 8px var(--cell-glow);
			}
			.cell.ghost {
				background: transparent;
				border: 1px solid var(--cell-strong) !important;
				box-shadow: none !important;
			}
			.overlay {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				color: var(--muted);
				font-size: 10px;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			.run-stats {
				width: 170px;
				display: flex;
				flex-direction: column;
				gap: 9px;
			}
			.identity,
			.stat,
			.next-card {
				background: var(--scrim);
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 10px 12px;
			}
			.identity {
				border-left-width: 3px;
			}
			.identity span,
			.stat span,
			.next-card > span {
				display: block;
				color: var(--muted);
				font-size: 9px;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				margin-bottom: 4px;
			}
			.identity strong {
				font-size: 12px;
				overflow-wrap: anywhere;
			}
			.stat {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
			}
			.stat span {
				margin: 0;
			}
			.stat strong {
				font-size: 20px;
			}
			.stat.danger strong {
				color: var(--danger);
			}
			.next-card {
				min-height: 103px;
			}
			.piece-preview {
				width: 72px;
				height: 72px;
				margin: 5px auto 0;
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				grid-template-rows: repeat(4, 1fr);
				gap: 2px;
			}
			.piece-preview .cell {
				background: transparent;
			}
			.piece-preview .cell[class*="piece-"] {
				border-radius: 2px;
			}
			.death-note {
				color: var(--faint);
				font-size: 10px;
				line-height: 1.5;
				padding: 2px;
			}
			.controls {
				width: min(100%, 620px);
				display: grid;
				grid-template-columns: repeat(5, 1fr) 1.5fr;
				gap: 6px;
				margin-top: 18px;
			}
			.controls button,
			footer button {
				border: 1px solid var(--input-line);
				background: var(--input-bg);
				border-radius: 5px;
				padding: 10px 8px;
				cursor: pointer;
				touch-action: manipulation;
			}
			.controls button:hover:not(:disabled),
			footer button:hover {
				border-color: var(--accent);
				background: var(--row-bg);
			}
			.controls button:active:not(:disabled) {
				transform: translateY(1px);
			}
			.controls button:disabled {
				opacity: 0.35;
				cursor: default;
			}
			.controls p {
				grid-column: 1 / -1;
				color: var(--faint);
				text-align: center;
				font-size: 9px;
				margin-top: 3px;
			}
			.community {
				min-width: 0;
				border-left: 1px solid var(--line);
				background: var(--panel);
				padding: 20px;
				display: flex;
				flex-direction: column;
				gap: 15px;
			}
			.crowd-heading {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.crowd-heading h2,
			.standings-title {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.12em;
			}
			.crowd-heading p {
				color: var(--muted);
				font-size: 10px;
				margin-top: 3px;
			}
			.live-dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 10px var(--accent);
			}
			.mini-grid {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 8px;
				min-height: 110px;
			}
			.mini-player {
				min-width: 0;
			}
			.mini-label {
				display: flex;
				gap: 4px;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 3px;
				font-size: 7px;
			}
			.mini-label span {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.mini-label b {
				color: var(--muted);
				font-weight: 400;
			}
			.tetris-board.mini {
				width: 100%;
				padding: 2px;
				gap: 0;
				border-color: var(--rule);
				box-shadow: none;
			}
			.tetris-board.mini .cell {
				border-radius: 0;
				border-width: 0;
				box-shadow: none;
			}
			.nobody {
				grid-column: 1 / -1;
				align-self: center;
				color: var(--faint);
				font-size: 10px;
				line-height: 1.5;
				text-align: center;
			}
			.more {
				color: var(--muted);
				text-align: right;
				font-size: 9px;
				margin-top: -8px;
			}
			.standings-title {
				margin-top: 5px;
			}
			.standings {
				list-style: none;
				display: flex;
				flex-direction: column;
				gap: 3px;
			}
			.standings li {
				display: flex;
				align-items: center;
				gap: 7px;
				min-width: 0;
				border: 1px solid transparent;
				border-radius: 4px;
				background: var(--field-3);
				padding: 6px 7px;
				font-size: 10px;
			}
			.standings li.self {
				border-color: var(--accent-line);
			}
			.standings .rank {
				width: 14px;
				color: var(--faint);
				text-align: right;
			}
			.standings i {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				flex: 0 0 auto;
			}
			.standings .who {
				flex: 1;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.standings .lines {
				color: var(--muted);
			}
			.standings strong {
				min-width: 38px;
				text-align: right;
			}
			.community footer {
				margin-top: auto;
				border-top: 1px solid var(--line);
				padding-top: 14px;
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.community footer button {
				font-size: 10px;
				padding: 8px;
			}
			.community footer p {
				color: var(--faint);
				font-size: 9px;
				line-height: 1.5;
			}
			@media (max-width: 900px) {
				.shell {
					grid-template-columns: 1fr;
				}
				.community {
					border-left: 0;
					border-top: 1px solid var(--line);
				}
				.mini-grid {
					grid-template-columns: repeat(8, 1fr);
				}
			}
			@media (max-width: 560px) {
				.game-area {
					padding: 18px 12px;
				}
				.play-layout {
					width: 100%;
					gap: 10px;
				}
				.tetris-board {
					width: min(62vw, 310px);
				}
				.run-stats {
					width: 29vw;
					min-width: 105px;
				}
				.identity,
				.stat,
				.next-card {
					padding: 7px;
				}
				.identity strong {
					font-size: 9px;
				}
				.stat strong {
					font-size: 15px;
				}
				.next-card {
					min-height: 76px;
				}
				.piece-preview {
					width: 52px;
					height: 52px;
				}
				.death-note {
					display: none;
				}
				.controls {
					grid-template-columns: repeat(3, 1fr);
				}
				.mini-grid {
					grid-template-columns: repeat(4, 1fr);
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./render.tsx"></script>
		<button id="theme-toggle" type="button" aria-label="Switch theme"></button>
		<script>
			// Three states: nothing pinned follows the OS, an explicit pick writes
			// data-theme plus localStorage. The icon shows where a click GOES —
			// a sun while dark — not where you currently are.
			(function () {
				var SUN =
					'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.2v1.6M8 13.2v1.6M14.8 8h-1.6M2.8 8H1.2M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1M12.8 12.8l-1.1-1.1M4.3 4.3 3.2 3.2"/></g></svg>';
				var MOON =
					'<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M13.7 10.1A5.9 5.9 0 0 1 6.2 2.5a6.5 6.5 0 1 0 7.5 7.6Z"/></svg>';
				var button = document.getElementById("theme-toggle");
				if (!button) return;
				var root = document.documentElement;
				var media = window.matchMedia("(prefers-color-scheme: dark)");

				function resolve() {
					var pinned = root.dataset.theme;
					if (pinned === "light" || pinned === "dark") return pinned;
					return media.matches ? "dark" : "light";
				}
				function paint(theme) {
					var next = theme === "dark" ? "light" : "dark";
					button.innerHTML = theme === "dark" ? SUN : MOON;
					button.setAttribute("aria-label", "Switch to " + next + " theme");
					button.setAttribute("title", "Switch to " + next + " theme");
				}
				paint(resolve());
				button.addEventListener("click", function () {
					var next = resolve() === "dark" ? "light" : "dark";
					root.dataset.theme = next;
					try {
						localStorage.setItem("reflectdb-theme", next);
					} catch (e) {
						/* pick still holds for this page */
					}
					paint(next);
				});
				// Until something is pinned the OS is in charge, so follow it.
				media.addEventListener("change", function () {
					if (!root.dataset.theme) paint(resolve());
				});
			})();
		</script>
	</body>
</html>
