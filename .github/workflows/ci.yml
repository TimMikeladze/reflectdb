name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify package exports
        run: bun run verify:exports

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

  # Everything above runs under Bun, against the working tree. Nothing there
  # observes what a Node consumer observes: resolution through the published
  # "exports" map by package name, declaration files read without Bun's ambient
  # types, and module evaluation on a runtime with no `bun:sqlite`. This job
  # installs the packed tarball into a throwaway Node project and checks all
  # three. One OS is enough — the gap it covers is runtime, not platform.
  node-consumer:
    name: Node ${{ matrix.node }} consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in "engines", and current.
        node: ["22", "24"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify Node consumer
        run: bun run verify:node

  # The jobs above never look at landing/. It is a separate package with its own
  # lockfile, its own tsconfig and its own build, and the root type-check covers
  # only src/ and services/ — so a landing page that cannot compile passed CI
  # green until this job existed. One OS is enough: the gap is a missing build,
  # not a platform difference.
  landing:
    name: Landing build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: landing

      # `bun run build` here is `tsc --noEmit && vite build`, so this catches a
      # type error and a broken bundle in one step.
      - name: Build
        run: bun run build
        working-directory: landing

  # services/presence deploys on its own, from its own package.json, and until
  # this job existed nothing compiled it outside a deploy. The root type-check
  # does cover services/**, but it resolves imports against the *root*
  # node_modules — so a dependency the service forgot to declare passes there
  # and fails on the platform, which installs from services/presence alone.
  presence:
    name: Presence service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Its own lockfile, so this fails on drift the root install cannot see.
      - name: Install service dependencies
        run: bun install --frozen-lockfile
        working-directory: services/presence

      # Against services/presence/tsconfig.json and its own node_modules, which
      # is the resolution the platform actually performs.
      - name: Type check
        run: bunx tsc --noEmit
        working-directory: services/presence

      # vercel.json paths, a default export per handler, declared dependencies.
      - name: Verify service
        run: bun scripts/verify-presence.ts
