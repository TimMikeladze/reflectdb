app = "reflectdb-presence"
primary_region = "sjc"
kill_signal = "SIGTERM"
# Long enough for shutdown() to release every connection slot in Redis before
# the Machine goes away; a killed process leaves projects counted at their cap.
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "8080"
PRESENCE_PREFIX = "presence"

[http_service]
internal_port = 8080
force_https = true
# Suspend rather than stop: a resumed Machine restores from a memory snapshot,
# so the first connection after an idle period does not pay a cold boot.
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

  # Presence connections are long-lived, so the default per-Machine ceiling of
  # 25 concurrent connections would shed load long before memory is the limit.
  [http_service.concurrency]
  type = "connections"
  soft_limit = 400
  hard_limit = 500

  [[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
