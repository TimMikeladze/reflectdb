# Redis for the presence service.
#
# Deliberately not Upstash: presence is command-heavy and data-light, so
# per-command billing ($0.2/100K on Fly's managed plan) scales with cursor
# movement rather than with anything the customer values. A fixed-cost Machine
# is the right shape for this workload.
#
# No [http_service] and no [[services]] block: the app is reachable only over
# the organization's private 6PN network, at reflectdb-presence-redis.internal.
app = "reflectdb-presence-redis"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
